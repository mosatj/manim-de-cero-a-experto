[project]
name = "suma-de-impares"
version = "0.1.0"
description = "Lección animada: la suma de los impares es n²"
requires-python = ">=3.11"
dependencies = [
    "manim==0.22.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Para que las pruebas encuentren el paquete «componentes»
pythonpath = ["."]
testpaths = ["pruebas"]
